set-option -sa terminal-overrides ",xterm*:Tc"
set -g mouse on

unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g @catppuccin_flavour 'mocha'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'dreamsofcode-io/catppuccin-tmux'
set -g @plugin 'tmux-plugins/tmux-yank'

run '~/.tmux/plugins/tpm/tpm'

# set vi-mode
#set-window-option -g mode-keys vi
# keybindings
#bind-key -T copy-mode-vi v send-keys -X begin-selection
#bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
#bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# keybindings
bind-key -n C-l send-keys -R C-l


# split panes using | and -
bind | split-window -h
bind - split-window -v

# PANES
# Enable the pane border status line.
# It can be 'top' or 'bottom'.
set-option -g pane-border-status top

# Define the content of the pane border status line.
# #{pane_index} shows the pane number.
# #{pane_title} shows the title you set in Step 1.
set-option -g pane-border-format " #{pane_index} | #{pane_title} "

# Prompt to rename the current pane
bind-key r command-prompt -p "(rename pane)" "select-pane -T '%%'"
